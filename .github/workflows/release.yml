# Release dry run (Master plan 13.5, 16.2 of 13 October 2026; decision records 0025 and 0026).
# No public release before 1.0.0: this workflow never publishes. Started by hand, it builds the
# portable Windows app with the same PyInstaller setup as CI, packs Verdra-X.Y.Z-windows.zip
# exactly as a user would get it, checks that exact ZIP (Qt allowlist, legal texts and third-party
# notices, no diagnostic interception, one start of the app) and keeps it as a workflow artifact
# for a few days. No tag trigger, no write permission, no release, tag or upload anywhere else;
# tests/test_workflows.py fails if any workflow could publish. Publishing is turned on only by an
# owner-approved change for 1.0.0 (spec S-80).
name: Release dry run

on:
  workflow_dispatch:

# No permissions unless a job asks for them.
permissions: {}

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check the release ZIP (dry run)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Install
        run: uv sync --group build
      - name: PyInstaller
        run: uv run pyinstaller packaging/verdra.spec --noconfirm
      - name: Pack the ZIP a user would get
        env:
          COMMIT: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          uv run python tools/pack_test_build.py dist/Verdra "out/Verdra-${VERSION}-windows.zip"
          --commit "$COMMIT" --release "$VERSION"
      - name: Check the ZIP itself (Qt modules, legal texts, no diagnostics, the app starts)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python tools/pack_test_build.py --unpack "out/Verdra-${VERSION}-windows.zip" unpacked
          uv run python tools/check_build.py unpacked/Verdra --launch
      - name: The ZIP's app routes and serves a replacement (smoke test; a failure fails the run)
        # The same test as CI's build job, on the app a user would unpack: a fake Player and a
        # fake Roblox upstream on loopback. Nothing is uploaded unless it passes.
        run: uv run python tools/smoke_build.py unpacked/Verdra
      - name: SHA-256 in the run summary
        working-directory: out
        run: |
          {
            echo '```'
            sha256sum Verdra-*-windows.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One file, not zipped again: the artifact is the ZIP itself, kept for a few days.
          path: out/Verdra-${{ steps.version.outputs.version }}-windows.zip
          archive: false
          retention-days: 5
          if-no-files-found: error
