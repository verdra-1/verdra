# Every gate from Master Build Plan 12.3, on every push and pull request.
# Actions are pinned to full commit SHAs (13.5); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Static gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types
        run: uv run pyright
      - name: Layering
        run: uv run lint-imports
      - name: Licences
        run: uv run python tools/licences.py
      - name: Vulnerabilities
        run: uv run pip-audit --skip-editable --progress-spinner off
      - name: Colours
        run: uv run python tools/check_colours.py
      - name: Strings
        run: uv run python tools/check_strings.py
      - name: Docs
        run: uv run python tools/check_docs.py
      - name: Brand SVGs are generated from tokens
        run: uv run python tools/icons.py --check
      - name: Message catalogue is current
        run: uv run python tools/i18n.py --check
      - name: Lockfile is current
        run: uv lock --check
      - name: Secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  tests:
    name: Tests (${{ matrix.system }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, system: windows }
          - { runner: macos-15, system: macos }
          - { runner: macos-15-intel, system: macos }
          - { runner: ubuntu-24.04, system: linux }
    env:
      QT_QPA_PLATFORM: offscreen
      COVERAGE_FILE: .coverage.${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - name: Install
        run: uv sync
      - name: Tests
        run: uv run pytest --cov --cov-report=json:coverage.json -m "not slow"
      - name: Coverage floors (${{ matrix.system }})
        run: uv run python tools/coverage_floors.py coverage.json --system ${{ matrix.system }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.runner }}
          path: .coverage.${{ matrix.runner }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage (combined)
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine
        run: |
          uv run coverage combine .coverage.*
          uv run coverage json -o coverage.json
          uv run coverage report
      - name: Coverage floors (combined, changed lines)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            uv run python tools/coverage_floors.py coverage.json --diff-base "origin/$BASE_REF"
          else
            uv run python tools/coverage_floors.py coverage.json
          fi

  ci-ok:
    # The one check branch protection requires: green only when every gate is green.
    name: All gates green
    if: always()
    needs: [checks, tests, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
