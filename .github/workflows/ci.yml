# Every gate from Master Build Plan 12.3, on pull requests and on pushes to main.
# Actions are pinned to full commit SHAs (13.5); Dependabot keeps them current.
#
# The repository is public (plan 13.2), so standard GitHub-hosted runners are free and every
# run is a full run (decision record 0012): the static gates with gitleaks, every test on both
# runners (Windows and Linux; macOS is deferred until after 1.0, decision record 0014), the
# combined and changed-lines coverage floors, and the PyInstaller build with its Qt scan on both.
# The final check is named for what it proves, from the event alone. "All gates green", which
# branch protection requires, comes only from a run against main (a push, or a pull request
# into main), so nothing reaches main without the full matrix passing on the exact commit
# merged. A run on a stacked pull request reports "Full gates green (stacked)". An edit that
# isn't a retarget skips the final job, and GitHub doesn't evaluate the name of a skipped job:
# its check shows the raw name expression, never "All gates green", so a no-op run can neither
# pass nor block the required check (GitHub counts a skipped required check as passed).
# Retargeting a pull request to main starts a new run, which then reports "All gates green".
name: CI
# Shows the event behind each run (synchronize, edited, edited (retarget), …) in the run list;
# the duplicate-run report in the final job reads it.
run-name: >-
  CI: ${{ github.event.action || github.event_name }}${{
  github.event.changes.base.ref.from
  && github.event.changes.base.ref.from != github.event.pull_request.base.ref
  && ' (retarget)' || '' }} on ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    # "edited" matters only when the base branch was changed to another branch (a retarget);
    # any other edit, such as the title or description, starts a run that does nothing
    # (decision record 0012).
    types: [opened, synchronize, reopened, edited]

# No permissions unless a job asks for them; every job asks for read access only.
permissions: {}

concurrency:
  # One group per branch: a run cancels the run already in progress for that pull request. A
  # push that moves both a stacked pull request's branch and its base can send two
  # "synchronize" events; one of the two runs is cancelled before any step runs, and the run
  # that is kept checks out the current merge ref (decision record 0012). An "edited" event
  # that isn't a retarget goes to its own group, so it can't cancel a real run.
  group: >-
    ci-${{ github.ref }}-${{
    github.event.action == 'edited'
    && !(github.event.changes.base.ref.from
    && github.event.changes.base.ref.from != github.event.pull_request.base.ref)
    && 'ignored-event' || 'run' }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.base_ref }}
          # True only when the base branch itself changed, not when the same branch moved.
          RETARGET: >-
            ${{ github.event.changes.base.ref.from != null
            && github.event.changes.base.ref.from != github.event.pull_request.base.ref }}
        run: |
          if [ "$ACTION" = "edited" ] && [ "$RETARGET" != "true" ]; then
            mode=skip
          else
            mode=full
          fi
          echo "Event: $EVENT $ACTION, base ${BASE:-none}; mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  checks:
    name: Static gates
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types
        run: uv run pyright
      - name: Layering
        run: uv run lint-imports
      - name: Licences (runtime, dev and build groups)
        run: |
          uv sync --all-groups
          uv run python tools/licenses.py --report
      - name: Vulnerabilities
        run: uv run pip-audit --skip-editable --progress-spinner off
      - name: Colours
        run: uv run python tools/check_colors.py
      - name: Strings
        run: uv run python tools/check_strings.py
      - name: US spelling in user-facing text
        run: uv run python tools/check_spelling.py
      - name: Docs
        run: uv run python tools/check_docs.py
      - name: Brand SVGs are generated from tokens
        run: uv run python tools/icons.py --check
      - name: Message catalogue is current
        run: uv run python tools/i18n.py --check
      - name: Lockfile is current
        run: uv lock --check
      - name: Secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  tests:
    name: Tests (${{ matrix.system }}, ${{ matrix.runner }})
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, system: windows }
          - { runner: ubuntu-24.04, system: linux }
    env:
      QT_QPA_PLATFORM: offscreen
      COVERAGE_FILE: .coverage.${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - name: Install
        run: uv sync
      - name: Python is the pinned patch version
        # .python-version pins the exact patch (plan 16.2); uv installs it. Any other is an error.
        run: uv run python -c "import platform, pathlib; got = platform.python_version(); want = pathlib.Path('.python-version').read_text().strip(); assert got == want, f'Python {got}, but .python-version pins {want}'; print('Python', got)"
      - name: Tests
        # Every test, slow ones included.
        run: uv run pytest --cov --cov-report=json:coverage.json
      - name: Coverage floors (${{ matrix.system }})
        run: uv run python tools/coverage_floors.py coverage.json --system ${{ matrix.system }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.runner }}
          path: .coverage.${{ matrix.runner }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage (combined)
    needs: [plan, tests]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine
        run: |
          uv run coverage combine .coverage.*
          uv run coverage json -o coverage.json
          uv run coverage report
      - name: Coverage floors (combined, changed lines)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            uv run python tools/coverage_floors.py coverage.json --diff-base "origin/$BASE_REF"
          else
            uv run python tools/coverage_floors.py coverage.json
          fi

  build:
    # PyInstaller one-folder build (Master plan 13.6), then the Qt allowlist check of what was
    # actually bundled (8.1, risk R-07) and one start of the built app without a screen.
    name: Build (${{ matrix.runner }})
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - name: Install
        run: uv sync --group build
      - name: Python is the pinned patch version
        # .python-version pins the exact patch (plan 16.2); uv installs it. Any other is an error.
        run: uv run python -c "import platform, pathlib; got = platform.python_version(); want = pathlib.Path('.python-version').read_text().strip(); assert got == want, f'Python {got}, but .python-version pins {want}'; print('Python', got)"
      - name: PyInstaller
        run: uv run pyinstaller packaging/verdra.spec --noconfirm
      - name: Only allowed Qt modules in the build, and the build starts
        run: uv run python tools/check_build.py dist/Verdra --launch

  ci-ok:
    # Named from the event only, never from another job's output: "All gates green" (the check
    # branch protection requires) only for a run against main. It is green only when every gate
    # is. For an edit that isn't a retarget the `if` below skips the job, and GitHub shows this
    # name unevaluated, as the raw expression; "No-op (edited)" is what it would read if GitHub
    # ever evaluated it. The `if` must keep skipping exactly the events this name calls
    # "No-op (edited)"; tests/test_ci_plan.py checks both.
    name: >-
      ${{ github.event.action == 'edited'
      && !(github.event.changes.base.ref.from
      && github.event.changes.base.ref.from != github.event.pull_request.base.ref)
      && 'No-op (edited)'
      || (github.event_name == 'push' || github.base_ref == 'main') && 'All gates green'
      || 'Full gates green (stacked)' }}
    # A failed or skipped gate still reports here (red); a run the concurrency group cancels
    # reports nothing here, so a superseded run never leaves a red check behind.
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'skip' }}
    needs: [plan, checks, tests, coverage, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # the duplicate-run report lists this workflow's runs
    steps:
      - name: Other completed runs for this head (report only)
        # Plan 16.2: exactly one completed run per pull request head. This step lists any other
        # completed, not cancelled run of this workflow for the same head commit in the job
        # summary. It never fails the job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          others=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq "$(cat <<'JQ'
          .workflow_runs[]
          | select(.id != ($ENV.RUN_ID | tonumber))
          | select(.status == "completed")
          | select(.conclusion != "canceled" and .conclusion != "skipped")
          | select(.display_title | startswith("CI: edited on") | not)
          | "- [\(.display_title)](\(.html_url)): \(.conclusion)"
          JQ
          )") || { echo "::warning::The run list couldn't be read; no duplicate report."; exit 0; }
          {
            echo "### Other completed runs for ${HEAD_SHA:0:7}"
            if [ -z "$others" ]; then
              echo "None: this is the only completed run for this head."
            else
              echo "$others"
              echo "A run marked (retarget) tests the same head against a new base; any other"
              echo "entry is a duplicate (decision record 0012)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$others" ]; then
            echo "::warning::Other completed runs exist for this head; see the job summary."
          fi
      - name: Check results
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          COVERAGE: ${{ needs.coverage.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "Mode $MODE: plan $PLAN, checks $CHECKS, tests $TESTS, coverage $COVERAGE, build $BUILD"
          for result in "$PLAN" "$CHECKS" "$TESTS" "$COVERAGE" "$BUILD"; do
            [ "$result" = "success" ] || exit 1
          done
