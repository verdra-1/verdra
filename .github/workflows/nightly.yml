# Daily: long fuzzing, benchmarks, pip-audit and a dependency freshness report (Master plan 13.5).
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# No permissions unless a job asks for them.
permissions: {}

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Long property and fuzz tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    env:
      QT_QPA_PLATFORM: offscreen
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - name: Install
        run: uv sync
      - name: Every test, with long Hypothesis runs
        run: uv run pytest

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: Run benchmarks
        id: bench
        # tools/bench.py arrives with the first budget it measures (M1: proxy latency). Until
        # then this step reports that nothing is measured yet.
        run: |
          if [ -f tools/bench.py ]; then
            uv run python tools/bench.py --max-regression 20
          else
            echo "No benchmarks yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open an issue on regression
        if: failure() && steps.bench.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly benchmark regression (${new Date().toISOString().slice(0, 10)})`,
              body: `A benchmark regressed by more than 20%. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["performance"],
            });

  audit:
    name: Vulnerabilities and freshness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: pip-audit
        run: uv run pip-audit --skip-editable --progress-spinner off
      - name: Dependency freshness report
        run: |
          {
            echo "## Outdated dependencies"
            echo
            echo '```'
            uv tree --outdated --depth 1 --no-dev
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
