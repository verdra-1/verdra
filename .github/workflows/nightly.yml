# Daily: long fuzzing, benchmarks, pip-audit, a dependency freshness report (Master plan 13.5) and
# the whole test suite several times in a shuffled order, to find tests that pass or fail depending
# on what ran before them (plan 16.2, "M1 decisions"). Every job runs on Windows, the only platform
# (decision record 0018).
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      windows_runs:
        description: Shuffled runs of the whole suite on Windows
        default: "3"
      repeat_only:
        description: Run only the shuffled repeats (for proving a pull request's fix)
        type: boolean
        default: false
      benchmarks_only:
        description: Run only the benchmarks (for measuring a pull request's baseline)
        type: boolean
        default: false

# No permissions unless a job asks for them.
permissions: {}

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Long property and fuzz tests (${{ matrix.runner }})
    if: ${{ !inputs.repeat_only && !inputs.benchmarks_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: Every test, with long Hypothesis runs
        run: uv run pytest

  benchmarks:
    name: Benchmarks
    if: ${{ !inputs.repeat_only }}
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: Run benchmarks
        id: bench
        # Spec S-11 test 5: the latency the proxy adds (plan 12.4), against the budget and against
        # tools/bench_baseline.json. The result goes to the job summary.
        run: |
          {
            echo '```'
            uv run python -m tools.bench --max-regression 20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open an issue on regression
        if: failure() && steps.bench.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly benchmark regression (${new Date().toISOString().slice(0, 10)})`,
              body: `A benchmark missed its budget (plan 12.4) or regressed by more than 20%. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["performance"],
            });

  audit:
    name: Vulnerabilities and freshness
    if: ${{ !inputs.repeat_only && !inputs.benchmarks_only }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: pip-audit
        run: uv run pip-audit --skip-editable --progress-spinner off
      - name: Dependency freshness report
        run: |
          {
            echo "## Outdated dependencies"
            echo
            echo '```'
            uv tree --outdated --depth 1 --no-dev
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  repeat:
    name: Whole suite, repeated in shuffled order (${{ matrix.runner }})
    if: ${{ !inputs.benchmarks_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, runs: "${{ inputs.windows_runs || '3' }}" }
    env:
      QT_QPA_PLATFORM: offscreen
      RUNS: ${{ matrix.runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync
      - name: Shuffled runs
        # Every run gets a new seed; a failing one is replayed with `pytest --shuffle=<seed>`.
        # All runs complete, then the step fails if any of them failed.
        run: |
          failed=0
          echo "### Shuffled runs on ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"
          for run in $(seq 1 "$RUNS"); do
            seed=$(( (RANDOM << 15 | RANDOM) ))
            if uv run pytest -q -p no:cacheprovider --shuffle="$seed" > "run-$run.log" 2>&1; then
              result=passed
            else
              result=FAILED
              failed=$((failed + 1))
              grep -E "^(FAILED|ERROR) " "run-$run.log" || tail -n 40 "run-$run.log"
            fi
            echo "- run $run, seed $seed: $result ($(tail -n 1 "run-$run.log"))" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "**$failed of $RUNS runs failed.**" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

  newest-python:
    name: Whole suite on the newest Python 3.14 (${{ matrix.runner }})
    if: ${{ !inputs.repeat_only && !inputs.benchmarks_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      VERDRA_PYTHON_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Newest Python 3.14
        # The pinned patch is in .python-version; this job tries whatever 3.14.x is newest, so an
        # upstream change shows up here before anyone moves the pin (plan 16.2).
        run: |
          uv python install 3.14
          newest=$(uv python list 3.14 --only-installed --output-format json | uv run --no-project python -c "import json, re, sys; finals = [v['version'] for v in json.load(sys.stdin) if re.fullmatch(r'3\.14\.\d+', v['version'])]; print(max(finals, key=lambda v: int(v.split('.')[2])))")
          echo "NEWEST=$newest" >> "$GITHUB_ENV"
          echo "Newest Python 3.14: $newest (pinned: $(cat .python-version))" >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: uv sync --python "$NEWEST"
      - name: Every test on the newest Python
        id: suite
        run: uv run --python "$NEWEST" pytest -q -p no:cacheprovider
      - name: Open an issue if the newest Python fails
        if: failure() && steps.suite.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tests fail on Python ${process.env.NEWEST} (${{ matrix.runner }})`,
              body: `The nightly run of the whole suite on the newest Python 3.14 failed; the pinned version in .python-version is unaffected. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
