# Platform facts that only need an installed client, established on throwaway CI runners (plan
# 16.2, "M1 decisions"; docs/platforms/protocol.md). Started by hand only.
#
# Windows only (decision record 0018: Linux is paused, so its Sober job left with it).
#
# Limits, which every step keeps: no Roblox login, account or cookies; no game launch; no contact
# with Roblox beyond the installer download and what the installer itself does; nothing that
# probes or bypasses Roblox security; the findings hold names, sizes, hashes, dates and package
# metadata only, never the contents of Roblox's program files.
name: Platform facts

on:
  workflow_dispatch:

# No permissions unless a job asks for them.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  roblox:
    name: Roblox Player on Windows (install, inspect)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and run the official installer
        shell: pwsh
        run: pwsh -NoProfile -File tools/platforms/install-roblox-windows.ps1 findings/install.txt
      - name: Record the facts (the Stage 1 script, as on the maintainer's PC)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/platforms/stage1-windows.ps1 -OutFile findings/windows.txt
      - name: Show the findings in the log (the evidence links to it)
        if: always()
        shell: pwsh
        run: Get-ChildItem findings -Filter '*.txt' | ForEach-Object { "### $($_.Name)"; Get-Content -LiteralPath $_.FullName }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: platform-facts-windows
          path: findings/
          if-no-files-found: error
