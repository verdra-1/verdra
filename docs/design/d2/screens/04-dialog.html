<!-- D2 screen 4: dialogs. One layout for every dialog (title, risk badge, two sentences, an
     optional checkbox, two buttons that name the action). Buttons never clip at larger text
     (D1 blocker 1); Cancel is the default on a risk warning. -->
<div class="scrim"></div>
<div class="center">
  <div class="dialog">
    <span class="badge account">Account-sensitive</span>
    <h2>Turn on multi-instance?</h2>
    <p>Verdra starts more than one Roblox at a time. Roblox may treat running several at once as a
      breach of its rules, which can affect your account.</p>
    <div class="check"><span class="box"></span><span>I understand the risk</span></div>
    <div class="actions"><a class="btn" href="#">Cancel</a><a class="btn primary" href="#">Turn on</a></div>
  </div>
</div>
