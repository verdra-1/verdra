[project]
name = "verdra"
version = "0.0.1"
description = "Change how your game looks, only on your screen."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Verdra Authors" }]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Private :: Do Not Upload",
]
# Floors from Reference R4. Exact versions live in uv.lock.
dependencies = [
  "PySide6>=6.11",
  "h11>=0.16",
  "httpx>=0.28",
  "truststore>=0.10",
  "certifi",
  # cryptography 49 and later publish no macOS x86-64 wheels (decision record 0007).
  "cryptography>=45,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography>=45; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "keyring>=25",
  "msgspec>=0.19",
  "zstandard>=0.23",
  "lz4>=4.4",
  "DracoPy>=1.4",
  "texture2ddecoder>=1.0.5",
  "Pillow>=11",
  "numpy>=2.2",
  "defusedxml>=0.7.1",
  "psutil>=7",
  "platformdirs>=4.3",
  "dnspython>=2.7",
  "pywin32>=310; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/verdra-1/verdra"
Issues = "https://github.com/verdra-1/verdra/issues"
Changelog = "https://github.com/verdra-1/verdra/blob/main/CHANGELOG.md"

[project.gui-scripts]
verdra = "verdra.__main__:main"

[dependency-groups]
dev = [
  "ruff>=0.13",
  "pyright>=1.1.405",
  "pytest>=8.4",
  "pytest-qt>=4.5",
  "pytest-cov>=7",
  "hypothesis>=6.140",
  "import-linter>=2.5",
  "pip-licenses>=5",
  "pip-audit>=2.9",
  "pre-commit>=4.3",
  # tools/icons.py: wordmark outlines from the display font.
  "fonttools>=4.60",
  "uharfbuzz>=0.50",
]
build = [
  "pyinstaller>=6.16",
  "cyclonedx-bom>=7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdra"]

[tool.uv]
default-groups = ["dev"]
# Lock only for the systems Verdra ships on (Master plan 11) ...
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
# ... and fail the lock if any of them lacks a wheel (risk R-08). Windows ARM64 is not listed:
# it runs the x64 build under emulation until every wheel exists (decision record 0007).
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# ---------------------------------------------------------------------------------------------
# Format and lint (Master plan 12.3)
# ---------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "BLE", "UP", "SIM", "PL"]
ignore = [
  # PLR0913: Qt constructors and dataclass-like services legitimately take many arguments.
  "PLR0913",
  # PLR2004: comparisons with literal numbers are clearer than named constants in tests and
  # in format code that follows a published specification byte by byte.
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest uses plain assert statements.
# S105, S106: redaction tests feed made-up secrets through every output path (Master plan 12.2).
# PLC0415: tests import inside functions to control Qt start-up order.
"tests/**" = ["S101", "S105", "S106", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["verdra"]

# ---------------------------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------------------------
# Tests and coverage (Master plan 12.1)
# ---------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
qt_api = "pyside6"
markers = [
  "slow: long-running property and fuzz tests, run nightly",
  "spec(spec_id, *numbers): the acceptance tests of a spec in docs/specs/ this test covers",
]

[tool.coverage.run]
source = ["verdra"]
branch = true

[tool.coverage.paths]
# Combine reports from the Windows, macOS and Linux runners.
source = ["src/verdra", "*/src/verdra", "*\\src\\verdra"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ---------------------------------------------------------------------------------------------
# Layering (Master plan 8.2). Checked by lint-imports.
# ---------------------------------------------------------------------------------------------

[tool.importlinter]
root_package = "verdra"
include_external_packages = true

[[tool.importlinter.contracts]]
# canopy → trunk → {roots, seedbank} → {strata, bark} → soil. "|" marks siblings that may not
# import each other. Nothing imports upward; soil imports nothing from the other areas.
name = "Layers (Master plan 8.2)"
type = "layers"
layers = [
  "verdra.canopy",
  "verdra.trunk",
  "verdra.roots | verdra.seedbank",
  "verdra.strata | verdra.bark",
  "verdra.soil",
]

[[tool.importlinter.contracts]]
# trunk is the only layer the UI talks to (Reference R1); canopy may still use soil's shared
# constants and safe-write helper.
name = "The UI talks only to trunk"
type = "forbidden"
source_modules = ["verdra.canopy"]
forbidden_modules = ["verdra.roots", "verdra.seedbank", "verdra.strata", "verdra.bark"]

[[tool.importlinter.contracts]]
# Parsers never unpickle (Master plan 10.7); the UI binding is PySide6 only (8.1). Qt modules
# outside the allowed list are checked by tools/licences.py.
name = "No unsafe deserialisers or other Qt bindings"
type = "forbidden"
source_modules = ["verdra"]
forbidden_modules = ["pickle", "marshal", "shelve", "PyQt5", "PyQt6"]

# ---------------------------------------------------------------------------------------------
# Licence allowlist (Master plan 12.3, Reference R4). Checked by tools/licences.py.
# ---------------------------------------------------------------------------------------------

[tool.verdra.licences]
allowed = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Apache-2.0",
  "PSF-2.0",
  "MPL-2.0",
  "LGPL-2.1",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "HPND",
  # Pillow's licence, an HPND variant (Reference R4, allowlist exceptions).
  "MIT-CMU",
  "Unlicense",
  "public domain",
]

# Packages whose metadata licence is outside the allowlist but whose use is permitted for a
# recorded reason. Each entry needs a reason.
[tool.verdra.licences.exceptions]
pyinstaller = "GPL-2.0-or-later with the bootloader exception, which permits bundling with software under any licence. Build tool only."
pyinstaller-hooks-contrib = "Hooks for PyInstaller (GPL-2.0 with exception, Apache-2.0 for runtime hooks). Build tool only."
numpy = "BSD-3-Clause. Linux wheels bundle libgfortran (GPL-3.0 with the GCC Runtime Library Exception), which permits distribution inside non-GPL programs."

# Qt modules the app may import (Master plan 8.1). Anything else, and every GPL-only add-on, fails CI.
[tool.verdra.qt]
allowed-modules = [
  "QtCore",
  "QtGui",
  "QtWidgets",
  "QtNetwork",
  "QtOpenGL",
  "QtOpenGLWidgets",
  "QtSvg",
  "QtMultimedia",
]
