[project]
name = "verdra"
version = "0.0.1"
description = "Change how your game looks, only on your screen."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Verdra Authors" }]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Private :: Do Not Upload",
]
# Floors from Reference R4. Exact versions live in uv.lock.
dependencies = [
  "PySide6>=6.11",
  "h11>=0.16",
  "httpx>=0.28",
  "truststore>=0.10",
  "certifi",
  # cryptography 49 and later publish no macOS x86-64 wheels (decision record 0007).
  "cryptography>=45,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography>=45; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "keyring>=25",
  "msgspec>=0.19",
  "zstandard>=0.23",
  "lz4>=4.4",
  "DracoPy>=1.4",
  "texture2ddecoder>=1.0.5",
  "Pillow>=11",
  "numpy>=2.2",
  "defusedxml>=0.7.1",
  "psutil>=7",
  "platformdirs>=4.3",
  "dnspython>=2.7",
  "pywin32>=310; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/verdra-1/verdra"
Issues = "https://github.com/verdra-1/verdra/issues"
Changelog = "https://github.com/verdra-1/verdra/blob/main/CHANGELOG.md"

[project.gui-scripts]
verdra = "verdra.__main__:main"

[dependency-groups]
dev = [
  "ruff>=0.13",
  "pyright>=1.1.405",
  "pytest>=8.4",
  "pytest-qt>=4.5",
  "pytest-cov>=7",
  "hypothesis>=6.140",
  "import-linter>=2.5",
  "pip-licenses>=5",
  "pip-audit>=2.9",
  "pre-commit>=4.3",
]
build = [
  "pyinstaller>=6.16",
  "cyclonedx-bom>=7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdra"]

[tool.uv]
default-groups = ["dev"]
# Lock only for the systems Verdra ships on (Master plan 11) ...
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
# ... and fail the lock if any of them lacks a wheel (risk R-08). Windows ARM64 is not listed:
# it runs the x64 build under emulation until every wheel exists (decision record 0007).
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# ---------------------------------------------------------------------------------------------
# Format and lint (Master plan 12.3)
# ---------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "BLE", "UP", "SIM", "PL", "TID251"]
ignore = [
  # PLR0913: Qt constructors and dataclass-like services legitimately take many arguments.
  "PLR0913",
  # PLR2004: comparisons with literal numbers are clearer than named constants in tests and
  # in format code that follows a published specification byte by byte.
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest uses plain assert statements.
# PLC0415: tests import inside functions to control Qt start-up order.
"tests/**" = ["S101", "PLC0415", "TID251"]
# TID251: tools load optional dev-only packages on use.
"tools/**" = ["TID251"]

# Dynamic imports would hide an import from the layering contracts and the Qt-module check
# (review finding M8), so the app's code never uses them (the built-in __import__ is checked
# by tests/test_layering.py).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"importlib.import_module".msg = "Import statically, so import-linter and the Qt check see it."
"importlib.__import__".msg = "Import statically, so import-linter and the Qt check see it."
"importlib.util.spec_from_file_location".msg = "Import statically, so the layering check sees it."
"importlib.util.module_from_spec".msg = "Import statically, so the layering check sees it."

[tool.ruff.lint.isort]
known-first-party = ["verdra"]

# ---------------------------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------------------------
# Tests and coverage (Master plan 12.1)
# ---------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
qt_api = "pyside6"
markers = [
  "slow: long-running property and fuzz tests, run nightly",
]

[tool.coverage.run]
source = ["verdra"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ---------------------------------------------------------------------------------------------
# Licence allowlist (Master plan 12.3, Reference R4). Checked by tools/licenses.py.
# ---------------------------------------------------------------------------------------------

[tool.verdra.licenses]
allowed = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Apache-2.0",
  "PSF-2.0",
  "MPL-2.0",
  "LGPL-2.1",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "HPND",
  # Pillow's licence, an HPND variant (Reference R4, allowlist exceptions).
  "MIT-CMU",
  # BSD Zero Clause: more permissive than MIT (Master plan 12.3, decision record 0010).
  "0BSD",
  "Unlicense",
  "public domain",
]

# Packages whose metadata licence is outside the allowlist but whose use is permitted for a
# recorded reason. Each entry needs a reason.
[tool.verdra.licenses.exceptions]
pyinstaller = "GPL-2.0-or-later with the bootloader exception, which permits bundling with software under any licence. Build tool only."
pyinstaller-hooks-contrib = "Hooks for PyInstaller (GPL-2.0 with exception, Apache-2.0 for runtime hooks). Build tool only."
numpy = "BSD-3-Clause. Linux wheels bundle libgfortran: GPL-3.0 with GCC Runtime Library Exception 3.1, which permits distribution inside non-GPL programs."

# Licences inside the Qt libraries the build ships, outside the allowlist, each permitted for a
# recorded reason (plan 16.2, decision record 0010). They aren't Python packages, so the report
# lists them separately.
[tool.verdra.licenses.qt-exceptions]
"AFL-2.1" = "The libdbus-1 headers inside Qt D-Bus (qtbase/src/dbus/dbus_minimal_p.h), dual-licensed AFL-2.1 OR GPL-2.0-or-later; verified in Qt's source and qt_attribution.json."

# Qt modules the app may import (Master plan 8.1). Anything else, and every GPL-only add-on, fails CI.
[tool.verdra.qt]
allowed-modules = [
  "QtCore",
  "QtGui",
  "QtWidgets",
  "QtNetwork",
  "QtOpenGL",
  "QtOpenGLWidgets",
  "QtSvg",
  "QtMultimedia",
]
